
name: Build SS GENERATOR APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SS_GENERATOR_MVP_v2_source.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract MVP v2 project
        run: |
          test -f SS_GENERATOR_MVP_v2_source.zip
          mkdir source
          unzip -q SS_GENERATOR_MVP_v2_source.zip -d source
          PROJECT_DIR=$(find source -name settings.gradle.kts -print -quit | xargs dirname)
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SS-GENERATOR-MVP-v2-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error

